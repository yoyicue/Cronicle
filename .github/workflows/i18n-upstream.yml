name: Official Release watch

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'yoyicue/Cronicle'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
      - name: Compare latest stable official Release with the supported baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/i18n/ci-upstream.cjs
      - name: Preserve detection result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-release
          path: tools/i18n/out/upstream-release.json
          retention-days: 30
          if-no-files-found: warn
