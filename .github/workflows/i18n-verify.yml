name: Linux layout diagnosis

on:
  push:
    branches: [zh-CN]
  pull_request:
    branches: [zh-CN]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Linux layout diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      RELEASE_TAG: ${{ inputs.release_tag }}
      PUBLISH_RELEASE: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
      - name: Validate release baseline and tag
        if: inputs.release_tag != ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags https://github.com/jhuckaby/Cronicle.git "refs/tags/v$VERSION:refs/tags/v$VERSION"
          node tools/i18n/ci-release.cjs preflight
      - name: Install locked dependencies without registering a service
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/i18n --no-audit --no-fund
      - name: Install browser dependencies and verified Caddy
        run: |
          tools/i18n/node_modules/node/bin/node tools/i18n/node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
          npm --prefix tools/i18n run prepare:caddy
      - name: Diagnose rendering and tracing on the same Linux runner
        run: tools/i18n/node_modules/node/bin/node tools/i18n/diagnose-performance.cjs
      - name: Preserve performance diagnosis
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i18n-diagnosis
          path: tools/i18n/out/diagnosis/
          if-no-files-found: error
          retention-days: 14
